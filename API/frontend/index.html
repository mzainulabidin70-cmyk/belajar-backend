<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perpustakaan PKL</title>
    
    <!-- KUNCI PERBAIKAN: Menggunakan CDN alternatif v4 yang lebih cepat dan anti-blokir -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-start p-4 sm:p-8 lg:p-12 font-sans">

    <h1 class="text-3xl font-extrabold text-slate-800 mb-8 tracking-tight">
         Sistem Perpustakaan
    </h1>

    <div id="wadahAuth" class="bg-white p-8 rounded-2xl border-black w-full max-w-sm border border-slate-100 shadow-lg shadow-slate-900/30">
        <h3 class="text-xl font-bold text-teal-900 text-center mb-6 tracking-wide">
            LOGIN PERPUS
        </h3>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Username</label>
                <input type="text" id="inputUsername" placeholder="Masukkan username" 
                       class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition bg-slate-50 text-slate-700 placeholder-slate-400">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="inputPassword" placeholder="••••••••" 
                       class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition bg-slate-50 text-slate-700 placeholder-slate-400">
            </div>
            
            <button id="tombolLogin" 
                    class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md transition duration-200">
                Login
            </button>
        </div>
        
        <p id="statusLogin" class="mt-4 text-center text-sm font-semibold text-rose-500"></p>
    </div>

    <div id="halamanUtama" class="hidden mt-8 w-full max-w-4xl bg-white p-6 rounded-2xl shadow-xl border border-slate-100">
        <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-6">
            <h2 class="text-xl font-bold text-slate-800">Dashboard Perpustakaan</h2>
            <button id="tombolLogout" 
                    class="bg-rose-500 hover:bg-rose-600 text-white font-medium py-2 px-4 rounded-xl text-sm shadow-md transition duration-200">
                Logout
            </button>
        </div>
        
        <div id="wadahBuku" class="grid w-full min-w-0 grid-flow-row auto-rows-fr grid-cols-1 items-stretch gap-6 sm:grid-cols-2 lg:grid-cols-3 [&>*]:h-full [&>*]:w-full [&>*]:min-w-0 [&>*]:max-w-full [&>*]:[overflow-wrap:anywhere]">
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
