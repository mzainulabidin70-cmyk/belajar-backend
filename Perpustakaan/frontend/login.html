<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perpustakaan PKL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-start p-4 sm:p-8 lg:p-12 font-sans selection:bg-teal-200">
    <h1 class="text-3xl font-extrabold text-slate-800 mb-8 tracking-tight md:text-4xl text-center">
        Sistem Perpustakaan Premium
    </h1>

    <div id="wadahAuth" class="bg-white p-8 rounded-2xl w-full max-w-sm border-r-6 border-b-6 border-gray-300 shadow-xl shadow-slate-900/10 transition-all duration-300 hover:shadow-2xl">
        <h3 class="text-2xl font-black text-teal-600 text-center mb-6 tracking-wide uppercase">
            Login Perpus
        </h3>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Username</label>
                <input
                    type="text"
                    id="inputUsername"
                    placeholder="username"
                    class="w-full px-4 py-2.5 border border-slate-200 hover:border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition bg-slate-50 text-slate-700 placeholder-slate-400"
                >
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                <input
                    type="password"
                    id="inputPassword"
                    placeholder="••••••••"
                    class="w-full px-4 py-2.5 border border-slate-200 hover:border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition bg-slate-50 text-slate-700 placeholder-slate-400"
                >
            </div>

            <button
                id="tombolLogin"
                class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98]">
                Masuk Ke Sistem
            </button>
        </div>
        
        <p id="statusLogin" class="mt-4 text-center text-sm font-semibold text-rose-500 min-h-5"></p>
    </div>
    <div id="loading-screen" class="hidden fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-slate-900/65 text-white">
        <div class="h-10 w-10 animate-spin rounded-full border-4 border-slate-300 border-t-blue-500 mb-3"></div>
        <span id="loading-text" class="text-base font-semibold">Memuat data...</span>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
