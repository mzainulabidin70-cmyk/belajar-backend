<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perpustakaan PKL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-start p-4 sm:p-8 lg:p-12 font-sans selection:bg-teal-200">

    <h1 class="text-3xl font-extrabold text-slate-800 mb-8 tracking-tight md:text-4xl text-center">
         Sistem Perpustakaan Premium
    </h1>

    <div id="halamanUtama" class="hidden mt-4 w-full max-w-5xl bg-white p-6 rounded-2xl shadow-xl border border-slate-100 transition-all duration-300">
        <div class="flex flex-col sm:flex-row justify-between items-center border-b border-slate-100 pb-4 mb-6 gap-4">
            <div>
                <h2 class="text-2xl font-black text-slate-800">Dashboard Manajemen Buku</h2>
                <p class="text-sm text-slate-500">Kelola database perpus dengan fitur CRUD instan</p>
            </div>
            <button id="tombolLogout" 
                    class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 px-5 rounded-xl text-sm shadow-md transition-all duration-300 transform hover:scale-105 active:scale-95">
                Keluar
            </button>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            <div class="lg:col-span-1 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                <h3 id="judulForm" class="text-lg font-extrabold text-slate-700 mb-4 uppercase tracking-wide">Tambah Buku Baru</h3>
                <input type="hidden" id="formSlug">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Judul Buku</label>
                        <input type="text" id="formJudul" placeholder="Contoh: Laskar Pelangi" 
                               class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white text-slate-700 placeholder-slate-400 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nama Penulis / Author</label>
                        <input type="text" id="formPenulis" placeholder="Contoh: Andrea Hirata" 
                               class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white text-slate-700 placeholder-slate-400 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Tahun Terbit</label>
                        <input type="number" id="formTahun" placeholder="Contoh: 2005" 
                               class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white text-slate-700 placeholder-slate-400 text-sm">
                    </div>
                    <div class="flex gap-2">
                        <button id="tombolSimpanBuku" 
                                class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 px-4 rounded-xl shadow-md text-sm transition-all duration-300 transform hover:scale-[1.02]">
                            Simpan Data
                        </button>
                        <button id="tombolBatalEdit" 
                                class="hidden bg-slate-400 hover:bg-slate-500 text-white font-bold py-2.5 px-4 rounded-xl text-sm transition-all duration-300">
                            Batal
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="mb-4">
                    <label for="pencarianBuku" class="sr-only">Cari buku</label>
                    <input type="search" id="pencarianBuku" placeholder="Cari berdasarkan judul..."
                           class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white text-slate-700 placeholder-slate-400 text-sm">
                </div>
                <div id="wadahBuku" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
